# Risezonic.com — FTP deploy (LIVE)
# Password = GitHub secret FTP_PASSWORD only.

name: Risezonic FTP Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: NPM INSTALL
        run: npm ci

      - name: BUILD REACT APP
        run: npm run build

      - name: Deploy by FTP (check dry-run flag!)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.risezonic.com
          username: deployrisezonic.com@risezonic.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dist/
          server-dir: /
          dry-run: false
          dangerous-clean-slate: false
          log-level: standard
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/node_modules/**/.*
            dist/**
            dist.zip
            **/*.zip
            images/**
            blogImages/**
            video/**
            .well-known/**
            .ftpquota
            .htaccess.phpupgrader*
